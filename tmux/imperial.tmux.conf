# Imperial Command Terminal — Tmux Theme
# Source from ~/.tmux.conf: source-file ~/path/to/imperial.tmux.conf

# ── General ────────────────────────────────────────────────────────────────────

set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Imperial Color Palette ─────────────────────────────────────────────────────
# bg: #0b0b0b | fg: #d8d0b0 | gold: #bfa35f | brass: #8f6b32 | red: #a61d24

set -g status-style "bg=#0b0b0b,fg=#bfa35f"
set -g status-left-style "bg=#0b0b0b,fg=#bfa35f,bold"
set -g status-right-style "bg=#0b0b0b,fg=#8f6b32"
set -g pane-border-style "fg=#4f4f4f"
set -g pane-active-border-style "fg=#8f6b32"
set -g message-style "bg=#1a1a1a,fg=#d8d0b0"
set -g message-command-style "bg=#1a1a1a,fg=#bfa35f"

# ── Status Bar ─────────────────────────────────────────────────────────────────

set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#bfa35f,bold]⚙ Machine Spirit #[fg=#8f6b32]│ "
set -g status-right "#[fg=#8f6b32]%Y-%m-%d #[fg=#4f4f4f]│ #[fg=#d8d0b0]#H "

# ── Window Status ──────────────────────────────────────────────────────────────

setw -g window-status-style "bg=#1a1a1a,fg=#8f6b32"
setw -g window-status-current-style "bg=#2a2a2a,fg=#bfa35f,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator ""

# ── Pane Titles ───────────────────────────────────────────────────────────────

setw -g pane-border-status top
setw -g pane-border-format " #[fg=#8f6b32]#{pane_index} #[fg=#d8d0b0]#{pane_title} "

# ── Activity ───────────────────────────────────────────────────────────────────

setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# ── Key Bindings (Imperial) ────────────────────────────────────────────────────

bind r source-file ~/.tmux.conf \; display "⚙ Machine Spirit re-initialized"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Mouse ──────────────────────────────────────────────────────────────────────

set -g mouse on
